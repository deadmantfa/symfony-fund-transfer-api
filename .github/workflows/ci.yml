name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, sodium
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/php-cs-fixer check --diff
      - run: vendor/bin/phpstan analyse
      - run: vendor/bin/rector process --dry-run
      - run: vendor/bin/deptrac analyse
      - run: composer audit

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fund_transfer_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, sodium
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pest --coverage-clover=docs/reports/clover.xml --log-junit=docs/reports/test-results.xml
        env:
          DATABASE_URL: postgresql://app:secret@127.0.0.1:5432/fund_transfer_test?serverVersion=16
          REDIS_URL: redis://127.0.0.1:6379
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: docs/reports/
