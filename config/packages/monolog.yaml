monolog:
    channels:
        - deprecation
        - transfer    # Transfer lifecycle: initiated, processing, completed, failed
        - security    # Auth events: register, login success/failure, KYC

when@dev:
    monolog:
        handlers:
            # Structured JSON → stdout so Docker captures it (and log aggregators can consume it).
            # Excludes doctrine + console + http_client so CLI commands stay readable.
            stdout_json:
                type:      stream
                path:      php://stdout
                level:     info
                formatter: monolog.formatter.json
                channels:  ['!event', '!deprecation', '!doctrine', '!console', '!http_client']
            # Full-detail debug log for local development
            main:
                type:     stream
                path:     "%kernel.logs_dir%/%kernel.environment%.log"
                level:    debug
                channels: ['!event']
            console:
                type:                   console
                process_psr_3_messages: false
                channels:               ['!event', '!doctrine', '!console', '!http_client']

when@test:
    monolog:
        handlers:
            main:
                type:                fingers_crossed
                action_level:        error
                handler:             nested
                excluded_http_codes: [404, 405]
                channels:            ['!event']
            nested:
                type:  stream
                path:  "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # fingers_crossed: buffer up to 50 records, only flush when a warning/error occurs.
            # Excludes business channels so those always emit regardless of error state.
            main:
                type:                fingers_crossed
                action_level:        warning
                handler:             stdout_nested
                excluded_http_codes: [404, 405]
                buffer_size:         50
                channels:            ['!event', '!deprecation', '!transfer', '!security']
            stdout_nested:
                type:      stream
                path:      php://stdout
                level:     debug
                formatter: monolog.formatter.json
            # Business channels bypass fingers_crossed — always emitted for audit/compliance
            transfer:
                type:      stream
                path:      php://stdout
                level:     info
                formatter: monolog.formatter.json
                channels:  [transfer]
            security_log:
                type:      stream
                path:      php://stdout
                level:     info
                formatter: monolog.formatter.json
                channels:  [security]
            console:
                type:                   console
                process_psr_3_messages: false
                channels:               ['!event', '!doctrine']
            deprecation:
                type:      stream
                channels:  [deprecation]
                path:      php://stderr
                formatter: monolog.formatter.json
