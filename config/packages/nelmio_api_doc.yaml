nelmio_api_doc:
    documentation:
        info:
            title: Fund Transfer API
            description: |
                Secure multi-currency fund transfer API.

                ## Authentication
                Use `POST /api/v1/auth/login` to obtain a JWT token, then include it as:
                `Authorization: Bearer <token>`

                ## Idempotency
                All `POST /api/v1/transfers` requests must include an `Idempotency-Key` header (UUID v4).

                ## Error Responses
                All errors follow RFC 9457 Problem Details format (`application/problem+json`).
            version: 1.0.0
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - bearerAuth: []
    areas:
        path_patterns:
            - ^/api
