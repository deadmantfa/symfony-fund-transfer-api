# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Infrastructure\FxRate\FrankfurterFxRateProvider:
        arguments:
            $httpClient: '@frankfurter.client'
            $baseUrl: '%env(FX_PROVIDER_URL)%'

    App\Domain\FxRate\FxRateProviderInterface:
        alias: App\Infrastructure\FxRate\FrankfurterFxRateProvider

    App\Infrastructure\FxRate\CachingFxRateService:
        arguments:
            $cacheTtl: '%env(int:FX_CACHE_TTL)%'

    App\Domain\FxRate\FxRateRepository:
        alias: App\Infrastructure\Persistence\DoctrineFxRateRepository

    App\Domain\User\UserRepository:
        alias: App\Infrastructure\Persistence\DoctrineUserRepository

    App\Domain\Account\AccountRepository:
        alias: App\Infrastructure\Persistence\DoctrineAccountRepository

    App\Domain\LedgerEntry\LedgerEntryRepository:
        alias: App\Infrastructure\Persistence\DoctrineLedgerEntryRepository

    App\Domain\Transfer\TransferRepository:
        alias: App\Infrastructure\Persistence\DoctrineTransferRepository

    App\Domain\AuditLog\AuditLogRepository:
        alias: App\Infrastructure\Persistence\DoctrineAuditLogRepository

    App\Application\Shared\IdempotencyService:
        arguments:
            $ttl: 86400

    App\Monolog\CorrelationIdProcessor:
        tags:
            - { name: monolog.processor }

    App\Controller\Api\V1\AuthController:
        arguments:
            $registerLimiter: '@limiter.register_limiter'
            $refreshTokenTtl: '%env(int:JWT_REFRESH_TTL)%'

    App\Controller\ReportController:
        arguments:
            $projectDir: '%kernel.project_dir%'

when@test:
    services:
        App\Infrastructure\FxRate\StubFxRateProvider: ~

        App\Domain\FxRate\FxRateProviderInterface:
            alias: App\Infrastructure\FxRate\StubFxRateProvider
