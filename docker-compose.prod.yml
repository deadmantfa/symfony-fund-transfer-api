# Production overrides for docker-compose.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes from dev:
#   - APP_ENV=prod: enables OPcache preloading, disables the debug toolbar,
#     uses the compiled DI container, and activates fingers_crossed log buffering
#   - APP_DEBUG=0: disables stack traces and the profiler
#   - validate_timestamps=0 injected via FRANKENPHP_NO_COMPRESS for maximum OPcache hit rate
#   - Worker runs without -vv verbosity

services:
  app:
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DATABASE_URL: postgresql://app:secret@postgres:5432/fund_transfer?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages

  worker:
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DATABASE_URL: postgresql://app:secret@postgres:5432/fund_transfer?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
    command: >
      sh -c "php bin/console messenger:setup-transports &&
             php bin/console messenger:consume async --time-limit=3600"
