# Production overrides for docker-compose.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   (or: make prod)
#
# Changes from dev:
#   - APP_ENV=prod: compiled DI container, no debug toolbar, fingers_crossed log buffering
#   - APP_DEBUG=0: no stack traces, no profiler
#   - APP_RUNTIME: FrankenPHP worker mode — Symfony kernel boots once per thread,
#     handles many requests in a loop (eliminates per-request bootstrap cost)
#   - Worker runs without -vv verbosity

services:
  app:
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_RUNTIME: Runtime\FrankenPhpSymfony\Runtime
      DATABASE_URL: postgresql://app:secret@postgres:5432/fund_transfer?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages

  worker:
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DATABASE_URL: postgresql://app:secret@postgres:5432/fund_transfer?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
    command: >
      sh -c "php bin/console messenger:setup-transports &&
             php bin/console messenger:consume async --time-limit=3600"
