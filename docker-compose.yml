services:
  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/app
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Caddyfile owns hostname config — SERVER_NAME not required
      APP_ENV: dev
      DATABASE_URL: postgresql://app:secret@postgres:5432/fund_transfer?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
      # Enable FrankenPHP worker mode — app boots once per thread, handles many requests.
      # In dev, code changes require `docker compose restart app` to take effect.
      APP_RUNTIME: Runtime\FrankenPhpSymfony\Runtime
    networks:
      default:
        # Allows other containers (e.g. k6) to reach the app as fund-transfer.local
        # or api.fund-transfer.local within the Docker network without extra_hosts tricks.
        aliases:
          - fund-transfer.local
          - api.fund-transfer.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Resolve the domain to 127.0.0.1 inside the container — no /etc/hosts needed
      test: ["CMD", "curl", "-fk", "--resolve", "api.fund-transfer.local:443:127.0.0.1", "https://api.fund-transfer.local/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    # Setup Redis stream group on first start, then begin consuming
    command: >
      sh -c "php bin/console messenger:setup-transports &&
             php bin/console messenger:consume async --time-limit=3600 -vv"
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://app:secret@postgres:5432/fund_transfer?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # Worker has no HTTP server — verify PHP is still running
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fund_transfer
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d fund_transfer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    # Served via Caddy at https://mail.fund-transfer.local (no direct port needed)

  pgweb:
    image: sosedoff/pgweb:latest
    # Served via Caddy at https://db.fund-transfer.local — auto-connects, no login screen.
    environment:
      DATABASE_URL: postgresql://app:secret@postgres:5432/fund_transfer?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  k6:
    image: grafana/k6:latest
    profiles: [load-test]
    volumes:
      - ./tests/load:/tests
    environment:
      API_URL:    https://api.fund-transfer.local
      SEED_EMAIL: load_test@example.com
      SEED_PASS:  Password123!
    command: run --out json=/tests/results.json /tests/transfer-scenario.js
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
