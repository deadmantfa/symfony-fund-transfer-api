; docker/frankenphp/php.ini
; Production-tuned PHP settings for FrankenPHP.
; Applied in all environments via the Docker image build.

[opcache]
; Core settings
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=20
opcache.max_accelerated_files=20000
; validate_timestamps=1: check for file changes (safe for dev; set to 0 in prod for max throughput)
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; JIT — tracing mode gives the best throughput for mixed web/async workloads
; (Requires opcache.jit_buffer_size > 0 to activate)
opcache.jit=tracing
opcache.jit_buffer_size=64M

[PHP]
memory_limit=256M
max_execution_time=30
